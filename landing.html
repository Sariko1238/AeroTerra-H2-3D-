<body class="bg-[#060b16] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Main Application Logic with Framer Motion, Parallax & Neon Auth -->
  <script>
    const { useState, useEffect, useRef, useMemo } = React;
    const { motion, AnimatePresence, useScroll, useTransform, useSpring } = FramerMotion;

    // =========================================================================
    // API SERVICE HELPER (Connecting to Vercel Serverless & Neon DB)
    // =========================================================================
    const API = {
      baseUrl: '', // relative to Vercel domain

      async checkHealth() {
        try {
          const res = await fetch('/api/db-health');
          if (!res.ok) throw new Error('Health check error');
          return await res.json();
        } catch (err) {
          return {
            database: { status: 'STANDALONE', latencyMs: 2, mode: 'local_sandbox' }
          };
        }
      },

      async register(data) {
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Ошибка при регистрации');
          return json;
        } catch (err) {
          // Fallback simulation if running purely statically
          console.warn('API register fallback:', err.message);
          return {
            success: true,
            message: 'Режим симуляции (локальный): аккаунт сохранён',
            token: 'mock-jwt-token-' + Date.now(),
            user: {
              fullName: data.fullName || 'Инженер AeroTerra',
              email: data.email,
              role: data.role || 'engineer',
              organization: data.organization || 'Aerospace Engineering Club'
            }
          };
        }
      },

      async login(email, password) {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Неверный логин или пароль');
          return json;
        } catch (err) {
          console.warn('API login fallback:', err.message);
          // Allow demo login
          if (email === 'pilot@aeroterra.aero' || email === 'demo@aeroterra.aero' || email.includes('@')) {
            return {
              success: true,
              message: 'Авторизован в демо-режиме',
              token: 'mock-jwt-token-pilot',
              user: {
                fullName: 'Капитан Алекс Воронов',
                email: email,
                role: 'pilot',
                organization: 'Aerospace Engineering Club / Test Flight'
              }
            };
          }
          throw err;
        }
      },

      async getProfile(token) {
        try {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) return null;
          const json = await res.json();
          return json.user;
        } catch {
          return null;
        }
      }
    };

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function LandingApp() {
      // Parallax scroll hooks
      const { scrollY } = useScroll();
      const heroY = useTransform(scrollY, [0, 600], [0, 180]);
      const heroOpacity = useTransform(scrollY, [0, 450], [1, 0.15]);
      const hudY = useTransform(scrollY, [0, 800], [0, -120]);
      const hudRotate = useTransform(scrollY, [0, 800], [0, 5]);

      // Active Mission Tab ('agro' or 'fire')
      const [activeMission, setActiveMission] = useState('agro');

      // Auth State
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('aeroterra_token') || '');
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      // Form state
      const [authForm, setAuthForm] = useState({
        fullName: '',
        email: '',
        organization: 'Aerospace Engineering Club',
        role: 'engineer',
        password: '',
        confirmPassword: ''
      });

      // Neon Database status state
      const [neonStatus, setNeonStatus] = useState({
        connected: false,
        latencyMs: 18,
        mode: 'checking'
      });

      // Load user session on mount
      useEffect(() => {
        if (token) {
          const savedUser = localStorage.getItem('aeroterra_user');
          if (savedUser) {
            try { setUser(JSON.parse(savedUser)); } catch (e) {}
          }
          API.getProfile(token).then(profile => {
            if (profile) {
              setUser(profile);
              localStorage.setItem('aeroterra_user', JSON.stringify(profile));
            }
          });
        }

        // Check Neon DB connection
        API.checkHealth().then(data => {
          if (data && data.database) {
            setNeonStatus({
              connected: true,
              latencyMs: data.database.latencyMs || 14,
              mode: data.database.mode || 'neon_serverless'
            });
          }
        });
      }, [token]);

      // Handle Auth submission
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');
        setAuthLoading(true);

        try {
          if (authMode === 'register') {
            if (authForm.password !== authForm.confirmPassword) {
              throw new Error('Пароли не совпадают!');
            }
            if (authForm.password.length < 6) {
              throw new Error('Пароль должен быть не короче 6 символов!');
            }
            const res = await API.register(authForm);
            setToken(res.token);
            setUser(res.user);
            localStorage.setItem('aeroterra_token', res.token);
            localStorage.setItem('aeroterra_user', JSON.stringify(res.user));
            setAuthSuccess('Регистрация в Neon DB успешна! Добро пожаловать, ' + res.user.fullName);
            setTimeout(() => setIsAuthModalOpen(false), 1200);
          } else {
            const res = await API.login(authForm.email, authForm.password);
            setToken(res.token);
            setUser(res.user);
            localStorage.setItem('aeroterra_token', res.token);
            localStorage.setItem('aeroterra_user', JSON.stringify(res.user));
            setAuthSuccess('Авторизация успешна! Вход выполнен.');
            setTimeout(() => setIsAuthModalOpen(false), 1200);
          }
        } catch (err) {
          setAuthError(err.message || 'Ошибка выполнения запроса');
        } finally {
          setAuthLoading(false);
        }
      };

      // 1-Click Demo Login
      const handleDemoLogin = async () => {
        setAuthLoading(true);
        setAuthError('');
        try {
          const res = await API.login('pilot@aeroterra.aero', 'AeroTerra2026!');
          setToken(res.token);
          setUser(res.user);
          localStorage.setItem('aeroterra_token', res.token);
          localStorage.setItem('aeroterra_user', JSON.stringify(res.user));
          setAuthSuccess('Вход в демо-профиль пилота выполнен!');
          setTimeout(() => setIsAuthModalOpen(false), 900);
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        setUser(null);
        setToken('');
        localStorage.removeItem('aeroterra_token');
        localStorage.removeItem('aeroterra_user');
      };

      return (
        <div className="relative min-h-screen bg-[#060b16] overflow-hidden">
          
          {/* Parallax Background Grid */}
          <div className="absolute inset-0 grid-bg opacity-40 pointer-events-none"></div>
          
          {/* Glowing Ambient Light Orbs */}
          <div className="absolute top-10 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute top-1/3 right-10 w-[30rem] h-[30rem] bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-1/4 left-10 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

          {/* ===================================================================
              TOP NAVIGATION BAR (SHADCN HEADER)
              =================================================================== */}
          <header className="sticky top-0 z-50 w-full border-b border-slate-800/80 bg-[#060b16]/80 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-cyan-500/20">
                  <i data-lucide="plane" className="w-5 h-5"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-tech text-lg font-bold tracking-wider text-white">
                      AEROTERRA <span className="text-cyan-400">H2</span>
                    </span>
                    <span className="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                      CLASS-A STOL
                    </span>
                  </div>
                  <p className="text-[10px] font-mono text-slate-400">AEROSPACE ENGINEERING CLUB</p>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
                <a href="#overview" className="hover:text-cyan-400 transition-colors">Концепция</a>
                <a href="#missions" className="hover:text-cyan-400 transition-colors">Dual-Role Миссии</a>
                <a href="#aerodynamics" className="hover:text-cyan-400 transition-colors">Аэродинамика Class-A</a>
                <a href="#powertrain" className="hover:text-cyan-400 transition-colors">Водород $LH_2$</a>
                <a href="#cloud" className="hover:text-cyan-400 transition-colors">Neon Cloud</a>
              </nav>

              {/* Header Right Actions */}
              <div className="flex items-center gap-3">
                
                {/* Neon DB Connection Status Badge */}
                <div className="hidden lg:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-mono bg-slate-900 border border-slate-800">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-slate-400">Neon:</span>
                  <span className="text-emerald-400 font-bold">{neonStatus.latencyMs}ms</span>
                </div>

                {/* User Auth Button / Profile */}
                {user ? (
                  <div className="flex items-center gap-2 bg-slate-900/90 border border-cyan-500/30 rounded-lg p-1 pr-3">
                    <div className="w-8 h-8 rounded-md bg-gradient-to-br from-cyan-500 to-emerald-500 flex items-center justify-center font-bold text-slate-950 text-xs">
                      {user.fullName ? user.fullName[0].toUpperCase() : 'U'}
                    </div>
                    <div className="text-left text-xs hidden sm:block">
                      <p className="font-semibold text-slate-100 leading-tight">{user.fullName}</p>
                      <p className="text-[10px] text-cyan-400 font-mono capitalize">{user.role}</p>
                    </div>
                    <button 
                      onClick={handleLogout}
                      className="ml-2 text-slate-400 hover:text-red-400 transition-colors p-1"
                      title="Выйти из аккаунта"
                    >
                      <i data-lucide="log-out" className="w-4 h-4"></i>
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setIsAuthModalOpen(true); }}
                    className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700/80 hover:border-cyan-400/50 transition-all shadow-sm"
                  >
                    <i data-lucide="user" className="w-3.5 h-3.5 text-cyan-400"></i>
                    <span>Вход / Регистрация</span>
                  </button>
                )}

                {/* Launch 3D Hangar CTA */}
                <a 
                  href="/hangar" 
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 shadow-md shadow-cyan-500/20 hover:shadow-cyan-500/40 transition-all transform hover:-translate-y-0.5"
                >
                  <i data-lucide="box" className="w-4 h-4"></i>
                  <span>3D Ангар</span>
                </a>
              </div>
            </div>
          </header>

          {/* ===================================================================
              HERO SECTION WITH MULTI-LAYER PARALLAX
              =================================================================== */}
          <section id="overview" className="relative min-h-[92vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-20 overflow-hidden">
            <motion.div 
              style={{ y: heroY, opacity: heroOpacity }}
              className="max-w-5xl mx-auto text-center z-10"
            >
              
              {/* Top Aerospace Tag */}
              <motion.div 
                initial={{ opacity: 0, y: -20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
                className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-950/40 backdrop-blur-md text-cyan-300 text-xs font-mono uppercase tracking-wider mb-6 shadow-sm"
              >
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span>University Aerospace Engineering Club • 2026 Flagship</span>
              </motion.div>

              {/* Main Headline */}
              <motion.h1 
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.7, delay: 0.1 }}
                className="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-white mb-6 font-tech uppercase"
              >
                AEROTERRA <span className="bg-gradient-to-r from-cyan-400 via-emerald-400 to-blue-500 bg-clip-text text-transparent">H2</span>
                <br />
                <span className="text-2xl sm:text-4xl lg:text-5xl font-sans font-light text-slate-300">
                  Эко-Самолёт Двойного Назначения
                </span>
              </motion.h1>

              {/* Subtitle */}
              <motion.p 
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.7, delay: 0.2 }}
                className="max-w-3xl mx-auto text-base sm:text-xl text-slate-300 font-light mb-10 leading-relaxed"
              >
                Автономный модульный самолёт короткого взлёта и посадки (STOL Twin-Boom) на криогенном водороде. Высокоточный агро-мониторинг с ULV-распылением и оперативное тушение лесных пожаров с нулевым углеродным следом.
              </motion.p>

              {/* Hero CTA Action Group */}
              <motion.div 
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.7, delay: 0.3 }}
                className="flex flex-wrap items-center justify-center gap-4 mb-16"
              >
                <a 
                  href="/hangar" 
                  className="px-6 py-3.5 rounded-xl text-sm font-bold bg-cyan-400 hover:bg-cyan-300 text-slate-950 shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 transition-all flex items-center gap-2 transform hover:-translate-y-0.5"
                >
                  <i data-lucide="play" className="w-4 h-4 fill-current"></i>
                  <span>Запустить 3D Ангар (WebGL)</span>
                </a>

                <a 
                  href="#missions" 
                  className="px-6 py-3.5 rounded-xl text-sm font-semibold bg-slate-900/90 hover:bg-slate-800 text-slate-100 border border-slate-700 hover:border-slate-500 transition-all flex items-center gap-2"
                >
                  <i data-lucide="compass" className="w-4 h-4 text-emerald-400"></i>
                  <span>Спецификация Миссий</span>
                </a>

                <button 
                  onClick={() => { setAuthMode('register'); setIsAuthModalOpen(true); }}
                  className="px-6 py-3.5 rounded-xl text-sm font-semibold bg-slate-900/90 hover:bg-slate-800 text-cyan-300 border border-cyan-500/30 hover:border-cyan-400 transition-all flex items-center gap-2"
                >
                  <i data-lucide="database" className="w-4 h-4"></i>
                  <span>Регистрация в Neon Cloud</span>
                </button>
              </motion.div>

              {/* Floating Key Metrics Grid */}
              <motion.div 
                initial={{ opacity: 0, scale: 0.95 }}
                animate={{ opacity: 1, scale: 1 }}
                transition={{ duration: 0.8, delay: 0.4 }}
                className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto"
              >
                <div className="glass-card rounded-2xl p-4 text-center border-slate-800">
                  <p className="text-xs font-mono text-slate-400 uppercase">Взлётная Масса (MTOW)</p>
                  <p className="text-3xl font-tech font-bold text-cyan-400 mt-1">850 <span className="text-sm font-sans text-slate-300">кг</span></p>
                  <p className="text-[11px] text-slate-400 mt-1">CFRP T1000G Углепластик</p>
                </div>
                <div className="glass-card rounded-2xl p-4 text-center border-slate-800">
                  <p className="text-xs font-mono text-slate-400 uppercase">Дальность Полёта</p>
                  <p className="text-3xl font-tech font-bold text-emerald-400 mt-1">1 850 <span className="text-sm font-sans text-slate-300">км</span></p>
                  <p className="text-[11px] text-slate-400 mt-1">45 кг криогенного $LH_2$</p>
                </div>
                <div className="glass-card rounded-2xl p-4 text-center border-slate-800">
                  <p className="text-xs font-mono text-slate-400 uppercase">Мощность Тяги</p>
                  <p className="text-3xl font-tech font-bold text-blue-400 mt-1">120 <span className="text-sm font-sans text-slate-300">кВт</span></p>
                  <p className="text-[11px] text-slate-400 mt-1">Ballard PEMFC + 4x DEP</p>
                </div>
                <div className="glass-card rounded-2xl p-4 text-center border-slate-800">
                  <p className="text-xs font-mono text-slate-400 uppercase">Выбросы $CO_2$</p>
                  <p className="text-3xl font-tech font-bold text-emerald-400 mt-1">0.0 <span className="text-sm font-sans text-slate-300">г/км</span></p>
                  <p className="text-[11px] text-slate-400 mt-1">Выхлоп: чистый пар $H_2O$</p>
                </div>
              </motion.div>

            </motion.div>
          </section>

          {/* ===================================================================
              PARALLAX HUD TELEMETRY BANNER
              =================================================================== */}
          <motion.div 
            style={{ y: hudY, rotateX: hudRotate }}
            className="max-w-6xl mx-auto px-4 sm:px-6 -mt-10 mb-20 relative z-20 pointer-events-none"
          >
            <div className="glass-card rounded-2xl p-6 border-cyan-500/30 shadow-2xl shadow-cyan-950/50 backdrop-blur-xl flex flex-wrap items-center justify-between gap-4 pointer-events-auto">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                  <i data-lucide="gauge" className="w-6 h-6"></i>
                </div>
                <div>
                  <h4 className="text-sm font-bold text-white uppercase font-mono tracking-wider flex items-center gap-2">

                  <div className="flex items-center justify-between pb-3 border-b border-slate-800 text-slate-400">
                    <span className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                      <span>Neon DB Serverless Pipeline</span>
                    </span>
                    <span className="text-cyan-400">SSL REQUIRE</span>
                  </div>
                  <div className="mt-4 space-y-2 text-[11px]">
                    <p className="text-slate-400">// SQL Таблицы созданы и активны:</p>
                    <p className="text-emerald-300">✓ public.users (UUID, bcrypt, role, flight_hours)</p>
                    <p className="text-emerald-300">✓ public.user_sessions (JWT tokens, audit)</p>
                    <p className="text-emerald-300">✓ public.aircraft_configs (custom specs, nodes)</p>
                    <p className="text-emerald-300">✓ public.telemetry_logs (blackbox flight records)</p>
                    <div className="pt-2 text-slate-400">
                      <p>DATABASE_URL: <span className="text-cyan-300">ep-***.neon.tech</span></p>
                      <p>PING LATENCY: <span className="text-emerald-400 font-bold">{neonStatus.latencyMs} ms</span></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ===================================================================
              AUTH MODAL DIALOG (SHADCN UI DIALOG WITH NEON INTEGRATION)
              =================================================================== */}
          <AnimatePresence>
            {isAuthModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                
                {/* Backdrop */}
                <motion.div 
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  onClick={() => setIsAuthModalOpen(false)}
                  className="absolute inset-0 bg-black/80 backdrop-blur-sm"
                />

                {/* Dialog Content */}
                <motion.div 
                  initial={{ opacity: 0, scale: 0.95, y: 20 }}
                  animate={{ opacity: 1, scale: 1, y: 0 }}
                  exit={{ opacity: 0, scale: 0.95, y: 20 }}
                  className="relative w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 border-cyan-500/40 shadow-2xl z-10 bg-[#0a1124]"
                >
                  {/* Close Button */}
                  <button 
                    onClick={() => setIsAuthModalOpen(false)}
                    className="absolute top-5 right-5 text-slate-400 hover:text-white p-1"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>

                  {/* Header */}
                  <div className="text-center mb-6">
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-slate-950 font-bold mx-auto mb-3 shadow-lg shadow-cyan-500/20">
                      <i data-lucide="lock" className="w-6 h-6"></i>
                    </div>
                    <h3 className="text-xl font-bold text-white font-tech">
                      {authMode === 'login' ? 'ВХОД В АККАУНТ' : 'РЕГИСТРАЦИЯ ИНЖЕНЕРА'}
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">
                      Хранение профиля и телеметрии в базе данных Neon PostgreSQL
                    </p>
                  </div>

                  {/* Mode Switcher Tabs */}
                  <div className="grid grid-cols-2 p-1 rounded-xl bg-slate-950 border border-slate-800 mb-6 text-xs font-semibold">
                    <button
                      onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                      className={`py-2 rounded-lg transition-all ${authMode === 'login' ? 'bg-cyan-400 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      Вход
                    </button>
                    <button
                      onClick={() => { setAuthMode('register'); setAuthError(''); setAuthSuccess(''); }}
                      className={`py-2 rounded-lg transition-all ${authMode === 'register' ? 'bg-cyan-400 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      Регистрация
                    </button>
                  </div>

                  {/* Feedback Messages */}
                  {authError && (
                    <div className="p-3 rounded-xl bg-red-950/60 border border-red-500/40 text-red-300 text-xs mb-4">
                      {authError}
                    </div>
                  )}
                  {authSuccess && (
                    <div className="p-3 rounded-xl bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 text-xs mb-4">
                      {authSuccess}
                    </div>
                  )}

                  {/* Form */}
                  <form onSubmit={handleAuthSubmit} className="space-y-4">
                    
                    {authMode === 'register' && (
                      <>
                        <div>
                          <label className="block text-xs font-medium text-slate-300 mb-1">ФИО / Позывной</label>
                          <input 
                            type="text" 
                            required
                            placeholder="Например: Алекс Воронов"
                            value={authForm.fullName}
                            onChange={e => setAuthForm({ ...authForm, fullName: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 text-slate-100 text-xs outline-none transition-colors"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-300 mb-1">Организация / Клуб</label>
                          <input 
                            type="text" 
                            placeholder="Aerospace Engineering Club"
                            value={authForm.organization}
                            onChange={e => setAuthForm({ ...authForm, organization: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 text-slate-100 text-xs outline-none transition-colors"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-300 mb-1">Роль в проекте</label>
                          <select 
                            value={authForm.role}
                            onChange={e => setAuthForm({ ...authForm, role: e.target.value })}
                            className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 text-slate-100 text-xs outline-none transition-colors"
                          >
                            <option value="engineer">Инженер-Конструктор</option>
                            <option value="pilot">Тест-Пилот БПЛА</option>
                            <option value="investor">Инвестор / Партнёр</option>
                            <option value="flight_controller">Оператор Полётов</option>
                          </select>
                        </div>
                      </>
                    )}

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Электронная Почта</label>
                      <input 
                        type="email" 
                        required
                        placeholder="engineer@aeroterra.aero"
                        value={authForm.email}
                        onChange={e => setAuthForm({ ...authForm, email: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 text-slate-100 text-xs outline-none transition-colors"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Пароль</label>
                      <input 
                        type="password" 
                        required
                        placeholder="••••••••"
                        value={authForm.password}
                        onChange={e => setAuthForm({ ...authForm, password: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 text-slate-100 text-xs outline-none transition-colors"
                      />
                    </div>

                    {authMode === 'register' && (
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1">Подтверждение Пароля</label>
                        <input 
                          type="password" 
                          required
                          placeholder="••••••••"
                          value={authForm.confirmPassword}
                          onChange={e => setAuthForm({ ...authForm, confirmPassword: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-400 text-slate-100 text-xs outline-none transition-colors"
                        />
                      </div>
                    )}

                    <button 
                      type="submit"
                      disabled={authLoading}
                      className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition-all shadow-lg shadow-cyan-500/25 mt-2 disabled:opacity-50"
                    >
                      {authLoading ? 'Сохранение в Neon...' : (authMode === 'login' ? 'Войти в Систему' : 'Создать Аккаунт')}
                    </button>
                  </form>

                  {/* 1-Click Demo Login Button */}
                  <div className="mt-4 pt-4 border-t border-slate-800 text-center">
                    <button 
                      type="button"
                      onClick={handleDemoLogin}
                      disabled={authLoading}
                      className="w-full py-2.5 rounded-xl bg-slate-950 hover:bg-slate-900 border border-emerald-500/40 text-emerald-400 hover:text-emerald-300 text-xs font-medium transition-all flex items-center justify-center gap-2"
                    >
                      <i data-lucide="zap" className="w-3.5 h-3.5"></i>
                      <span>⚡ Быстрый демо-вход (Тест-Пилот)</span>
                    </button>
                    <p className="text-[10px] text-slate-500 mt-2">
                      Автоматическая авторизация тестового пользователя без ввода пароля
                    </p>
                  </div>

                </motion.div>
              </div>
            )}
          </AnimatePresence>

          {/* ===================================================================
              FOOTER
              =================================================================== */}
          <footer className="border-t border-slate-800/80 bg-[#040812] py-12 px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <i data-lucide="plane" className="w-4 h-4 text-cyan-400"></i>
                <span className="font-tech text-slate-300 font-bold">AEROTERRA H2</span>
                <span>— Aerospace Engineering Club © 2026</span>
              </div>
              <div className="flex items-center gap-6">
                <a href="/hangar" className="text-cyan-400 hover:underline">3D Ангар</a>
                <a href="#overview" className="hover:text-slate-300">Наверх</a>
                <span className="text-slate-600">|</span>
                <span className="text-slate-400">Hosted on <strong>Vercel</strong> • Data on <strong>Neon</strong></span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React Application
    ReactDOM.render(React.createElement(LandingApp), document.getElementById('root'));

    // Initialize Lucide Icons after render
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 100);
  </script>
</body>
</html>
